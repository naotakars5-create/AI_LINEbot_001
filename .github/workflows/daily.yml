name: daily-ai-digest

on:
  schedule:
    # UTC 22:00 = 日本時間 朝7:00
    # GitHub側の混雑で数分〜十数分ずれることがあります
    - cron: "0 22 * * *"
  workflow_dispatch:        # 画面から手動実行するためのボタン

permissions:
  contents: write           # ページと state.json をコミットするために必要

concurrency:
  group: daily-ai-digest    # 手動実行と定時実行がぶつかっても壊れないように
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ダイジェストを作って送る
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python main.py

      - name: 結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "digest $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          # 他の実行と重なっても落ちないよう、取り込んでから押し込む
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
