# 収集先の一覧
# lang: en / ja  … 選抜のときの比率(英語7:日本語3)に使う
# tier: primary  … 一次情報。同点なら優先される
#
# 追加したいときは行を足すだけ。要らないものは # で消す。

feeds:
  # ---------- 英語・一次情報（主軸） ----------
  # 2026-08-17時点で 404。公式の配信URLが変わったため、
  # 当面はGoogleニュース経由（下の「Googleニュース（AI各社）」）で拾っています
  # - name: Anthropic News
  #   url: https://www.anthropic.com/rss.xml
  #   lang: en
  #   tier: primary

  - name: OpenAI News
    url: https://openai.com/news/rss.xml
    lang: en
    tier: primary

  - name: Google DeepMind Blog
    url: https://deepmind.google/blog/rss.xml
    lang: en
    tier: primary

  - name: Google AI Blog
    url: https://blog.google/technology/ai/rss/
    lang: en
    tier: primary

  # 2026-08-17時点で 410 Gone。復活したらコメントを外してください
  # - name: Microsoft AI Blog
  #   url: https://blogs.microsoft.com/ai/feed/
  #   lang: en
  #   tier: primary

  # 2026-08-17時点で 404。配信URLが変わった可能性があります
  # - name: Meta AI Blog
  #   url: https://ai.meta.com/blog/rss/
  #   lang: en
  #   tier: primary

  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    lang: en
    tier: primary

  # ---------- 英語・メディア ----------
  - name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    lang: en
    tier: media

  - name: The Verge AI
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    lang: en
    tier: media

  - name: Ars Technica AI
    url: https://arstechnica.com/ai/feed/
    lang: en
    tier: media

  - name: Hacker News (150点以上)
    url: https://hnrss.org/frontpage?points=150
    lang: en
    tier: media

  # 公式ブログのRSSが落ちても各社の発表を拾えるようにする保険
  - name: Googleニュース（AI各社）
    url: https://news.google.com/rss/search?q=OpenAI+OR+Anthropic+OR+DeepMind+when:2d&hl=en-US&gl=US&ceid=US:en
    lang: en
    tier: media

  # ---------- 日本語（国内の動きをここで拾う） ----------
  - name: ITmedia AI+
    url: https://rss.itmedia.co.jp/rss/2.0/aiplus.xml
    lang: ja
    tier: media

  - name: ITmedia NEWS
    url: https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml
    lang: ja
    tier: media

  - name: Publickey
    url: https://www.publickey1.jp/atom.xml
    lang: ja
    tier: media

  - name: Zenn AI
    url: https://zenn.dev/topics/ai/feed
    lang: ja
    tier: media

  - name: Googleニュース（生成AI）
    url: https://news.google.com/rss/search?q=%E7%94%9F%E6%88%90AI+when:2d&hl=ja&gl=JP&ceid=JP:ja
    lang: ja
    tier: media

  - name: CNET Japan
    url: https://feeds.japan.cnet.com/rss/cnet/all.rdf
    lang: ja
    tier: media

  - name: GIGAZINE
    url: https://gigazine.net/news/rss_2.0/
    lang: ja
    tier: media

  - name: はてなブックマーク（テクノロジー）
    url: https://b.hatena.ne.jp/hotentry/it.rss
    lang: ja
    tier: media
